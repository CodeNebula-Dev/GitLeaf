<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <!-- Git Orange Gradient -->
    <linearGradient id="git-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#FF7043" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Horizontal Lines Pattern -->
    <pattern id="horizontal-lines" width="100" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="100" y2="4" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <!-- Stripe Clip & Glow -->
    <filter id="glow-git" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.4" />
    </filter>
    <filter id="glow-leaf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4" />
    </filter>

    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="45%" stop-color="#FF8A65" />
      <stop offset="55%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bold { font-weight: 900; }
    .stripe-line { stroke: #ffffff; stroke-opacity: 0.15; stroke-width: 1.5; }
    .term-dim { fill: #8b949e; font-size: 13px; }
    .term-green { fill: #34d399; font-weight: 600; font-size: 13px; }
    .term-orange { fill: #ff7043; font-weight: 600; font-size: 13px; }
    .term-white { fill: #e6edf3; font-size: 13px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Multi-Line Horizontal Background Grid -->
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="url(#horizontal-lines)" />

  <!-- Horizontal Multi-Line Tech Accents across Canvas -->
  <line x1="40" y1="75" x2="1160" y2="75" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="40" y1="235" x2="1160" y2="235" stroke="#30363d" stroke-width="1" stroke-dasharray="2 6" />
  <line x1="40" y1="315" x2="1160" y2="315" stroke="#30363d" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Multi-line horizontal stripes across the banner (Upper & Lower) -->
  <g opacity="0.4">
    <line x1="40" y1="120" x2="180" y2="120" stroke="#FF5722" stroke-width="1" />
    <line x1="40" y1="126" x2="160" y2="126" stroke="#FF5722" stroke-width="1" />
    <line x1="40" y1="132" x2="210" y2="132" stroke="#FF5722" stroke-width="1" />
    <line x1="40" y1="138" x2="140" y2="138" stroke="#FF5722" stroke-width="1" />

    <line x1="1020" y1="120" x2="1160" y2="120" stroke="#10B981" stroke-width="1" />
    <line x1="1040" y1="126" x2="1160" y2="126" stroke="#10B981" stroke-width="1" />
    <line x1="990" y1="132" x2="1160" y2="132" stroke="#10B981" stroke-width="1" />
    <line x1="1060" y1="138" x2="1160" y2="138" stroke="#10B981" stroke-width="1" />
  </g>

  <!-- Window Header -->
  <g transform="translate(30, 24)">
    <circle cx="12" cy="12" r="6" fill="#ff5f56" />
    <circle cx="32" cy="12" r="6" fill="#ffbd2e" />
    <circle cx="52" cy="12" r="6" fill="#27c93f" />
    <text x="80" y="16" class="mono term-dim">gitleaf-core // local-first-latex-engine</text>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(980, 20)">
    <rect x="0" y="4" width="180" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#34d399" />
    <text x="28" y="20" class="mono term-green" font-size="11">P2P_MESH_READY</text>
  </g>

  <!-- Main Brand Title: Up-and-Down Word Flow with Horizontal Line Cutouts -->
  <g transform="translate(60, 100)">
    <!-- "GIT" Section (Positioned higher, vibrant Git Orange) -->
    <g transform="translate(0, 45)">
      <!-- Drop Shadow / Glow Base -->
      <text x="180" y="65" class="mono bold" font-size="104" fill="url(#git-grad)" filter="url(#glow-git)" letter-spacing="4">GIT</text>
      
      <!-- Multi-Line Cutout Overlay on GIT -->
      <g opacity="0.3">
        <line x1="175" y1="10" x2="385" y2="10" stroke="#080c10" stroke-width="3" />
        <line x1="175" y1="25" x2="385" y2="25" stroke="#080c10" stroke-width="3" />
        <line x1="175" y1="40" x2="385" y2="40" stroke="#080c10" stroke-width="3" />
        <line x1="175" y1="55" x2="385" y2="55" stroke="#080c10" stroke-width="3" />
      </g>
    </g>

    <!-- Slash / Branch Connector -->
    <g transform="translate(385, 45)">
      <line x1="20" y1="75" x2="55" y2="5" stroke="url(#accent-bar)" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- "LEAF" Section (Positioned stepped/down, vibrant Leaf Green) -->
    <g transform="translate(435, 75)">
      <!-- Drop Shadow / Glow Base -->
      <text x="25" y="65" class="mono bold" font-size="104" fill="url(#leaf-grad)" filter="url(#glow-leaf)" letter-spacing="4">LEAF</text>
      
      <!-- Multi-Line Cutout Overlay on LEAF -->
      <g opacity="0.3">
        <line x1="20" y1="10" x2="305" y2="10" stroke="#080c10" stroke-width="3" />
        <line x1="20" y1="25" x2="305" y2="25" stroke="#080c10" stroke-width="3" />
        <line x1="20" y1="40" x2="305" y2="40" stroke="#080c10" stroke-width="3" />
        <line x1="20" y1="55" x2="305" y2="55" stroke="#080c10" stroke-width="3" />
      </g>
    </g>

    <!-- Tagline Subtitle inside brand header -->
    <text x="795" y="115" class="mono term-dim" font-size="13">:: LOCAL_FIRST_COLLABORATION</text>
    <text x="795" y="135" class="mono term-dim" font-size="13">:: DISTRIBUTED_CRDT_SYNC</text>
    <text x="795" y="155" class="mono term-dim" font-size="13">:: ZERO_SUBSCRIPTIONS</text>
  </g>

  <!-- Accent Divider Line -->
  <rect x="40" y="275" width="1120" height="2" fill="url(#accent-bar)" />

  <!-- Terminal Command Output Bar (Bottom Box) -->
  <g transform="translate(40, 295)">
    <!-- Terminal Panel -->
    <rect x="0" y="0" width="1120" height="95" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1" />

    <!-- Terminal Line 1 -->
    <text x="20" y="32" class="mono term-orange">$</text>
    <text x="35" y="32" class="mono term-white">gitleaf init ./paper --template=ieee-conference</text>
    <text x="490" y="32" class="mono term-dim"># creates local project folder</text>

    <!-- Terminal Line 2 -->
    <text x="20" y="58" class="mono term-green">&gt;</text>
    <text x="35" y="58" class="mono term-green">Local daemon initialized</text>
    <text x="235" y="58" class="mono term-white">| CRDT mesh listening on ws://localhost:4411 | 0$ co-author limits</text>

    <!-- Terminal Line 3 -->
    <text x="20" y="82" class="mono term-dim">&gt; Connected to peer: author2@machine [synced: 100% | local-fs: clean]</text>
  </g>
</svg>
